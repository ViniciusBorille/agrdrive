name: Automated tests

on: pull_request

jobs:
  jest:
    name: Jest Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"

      - run: npm ci

      # `.env.development` não é versionado, mas o compose, as migrations
      # e o jest leem dele. O example tem tudo que a suíte precisa — só
      # as credenciais do Google ficam em branco, e nenhum teste chama o
      # Google de verdade.
      - run: cp .env.development.example .env.development

      - run: npm test
